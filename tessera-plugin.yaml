# LichtValley Flux: electricity at home with solar AND a battery. The Power-Flux-Look: what the panels make, what
# the house uses, what comes from the grid or goes back to it, what the battery gives or takes, with its state of
# charge. Based on hflocki/tessera-energy (MIT), extended with the battery. Every field is explained in
# docs/MANIFEST.md of tessera-plugins.
id: lichtvalley_flux
version: 0.1.0
# 0.9: Tone, ui::set_fill and one-line labels; 0.10: ui::text.
api: "0.10"
icon: solar-power
maintainer: HatchetMan111
license: MIT
stage: beta
topics: [energy, home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 20

permissions:
  # The screen reads the chosen sensors itself.
  read_entities: ["{grid}", "{pv}", "{pv_today}", "{coverage}", "{forecast}", "{grid_today}", "{bat_rate}", "{soc}"]

inputs:
  # The grid power is the one that matters; every other sensor may stay empty.
  - { id: grid, kind: entity, domains: [sensor], scope: screen, label: input_grid, hint: input_grid_hint }
  - { id: pv, kind: entity, domains: [sensor], scope: screen, label: input_pv, hint: input_pv_hint }
  - { id: pv_today, kind: entity, domains: [sensor], scope: screen, label: input_pv_today, hint: input_pv_today_hint }
  - { id: coverage, kind: entity, domains: [sensor], scope: screen, label: input_coverage, hint: input_coverage_hint }
  - { id: forecast, kind: entity, domains: [sensor], scope: screen, label: input_forecast, hint: input_forecast_hint }
  - { id: grid_today, kind: entity, domains: [sensor], scope: screen, label: input_grid_today,
      hint: input_grid_today_hint }
  - { id: bat_rate, kind: entity, domains: [sensor], scope: screen, label: input_bat_rate, hint: input_bat_rate_hint }
  - { id: soc, kind: entity, domains: [sensor], scope: screen, label: input_soc, hint: input_soc_hint }

tiles:
  - id: flux
    name: tile_name
    icon: solar-power
    sizes: { min: 1x1, max: 6x3 }
    # Four circles with icons, eight labels, three arrows, the share bar and a line of the day.
    memory: 1800
    example: tile_example
    options:
      - { id: invert, kind: toggle, default: false, label: invert, hint: invert_hint }
      - { id: bat_invert, kind: toggle, default: false, label: bat_invert, hint: bat_invert_hint }
      - { id: today, kind: toggle, default: true, label: today, hint: today_hint }

cards:
  # A tap on the tile: the same, large, with the day so far.
  - { id: details, name: card_name, wide: true }
